# Application
quarkus.application.name=home-control

# MQTT broker connection, shared by every channel below unless overridden.
# Defaults to a local broker (e.g. `brew services start mosquitto`) for development;
# override MQTT_HOST/MQTT_PORT (and credentials, if needed) in other environments.
mqtt.host=${MQTT_HOST:localhost}
mqtt.port=${MQTT_PORT:1883}

# Incoming channel: subscribes to device/sensor events (e.g. zigbee2mqtt) that may trigger rules.
mp.messaging.incoming.device-events.connector=smallrye-mqtt
mp.messaging.incoming.device-events.host=${mqtt.host}
mp.messaging.incoming.device-events.port=${mqtt.port}
mp.messaging.incoming.device-events.topic=${MQTT_SUBSCRIBE_TOPIC:zigbee2mqtt/#}
mp.messaging.incoming.device-events.qos=1
mp.messaging.incoming.device-events.auto-generated-client-id=true
mp.messaging.incoming.device-events.client-id=${quarkus.application.name}-in

# Outgoing channel: publishes commands resulting from triggered rules.
# The actual destination topic is set per-message via SendingMqttMessageMetadata
# (see TopicEventProcessor); the "topic" below is only a fallback used when no
# metadata is attached to the outgoing message.
mp.messaging.outgoing.device-commands.connector=smallrye-mqtt
mp.messaging.outgoing.device-commands.host=${mqtt.host}
mp.messaging.outgoing.device-commands.port=${mqtt.port}
mp.messaging.outgoing.device-commands.topic=${MQTT_PUBLISH_FALLBACK_TOPIC:home-control/commands}
mp.messaging.outgoing.device-commands.qos=1
mp.messaging.outgoing.device-commands.auto-generated-client-id=true
mp.messaging.outgoing.device-commands.client-id=${quarkus.application.name}-out
